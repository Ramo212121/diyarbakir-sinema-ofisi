<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sayfa bulunamadı — Diyarbakır Sinema Ofisi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Courier+Prime:wght@700&family=DM+Sans:opsz,wght@9..40,400&display=swap" rel="stylesheet">
  <style>
    :root { --black: #0a0a0a; --white: #fafafa; --accent: #ffcc00; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--black);
      color: var(--white);
      font-family: "DM Sans", system-ui, sans-serif;
      text-align: center;
    }
    img { height: 56px; width: auto; }
    .code { margin: 40px 0 8px; font: 700 14px "Courier Prime", monospace; letter-spacing: .2em; color: var(--accent); }
    h1 { margin: 0; font: 900 clamp(48px, 12vw, 120px)/.9 "Big Shoulders Display", sans-serif; text-transform: uppercase; }
    h1 span { color: var(--accent); }
    p { max-width: 420px; margin: 20px auto 32px; color: rgba(250, 250, 250, .7); }
    a.btn {
      display: inline-block;
      padding: 16px 30px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--black);
      font: 900 18px "Big Shoulders Display", sans-serif;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <a href="/"><img src="/logo/d.bakır sinema ofisi renkli.png" alt="Diyarbakır Sinema Ofisi" width="1528" height="558"></a>
    <p class="code">404 · SAHNE BULUNAMADI</p>
    <h1>Bu kare<br><span>kurguda</span><br>kaldı.</h1>
    <p>Aradığınız sayfa taşınmış ya da hiç çekilmemiş olabilir.</p>
    <a class="btn" href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
